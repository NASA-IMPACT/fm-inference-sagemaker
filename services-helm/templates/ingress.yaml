apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prediction-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/client-max-body-size: "50m"
    # Enable CORS but disable compression to prevent content decoding errors
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "*"
spec:
  tls:
  - hosts:
    - {{ .Values.ingressPrediction.host  }}
    secretName: {{ .Values.ingressPrediction.tlsSecretName }}
  rules:
  - host: {{ .Values.ingressPrediction.host  }}
    http:
      paths:
      - path: {{ .Values.ingressPrediction.path  }}
        pathType: Prefix
        backend:
          service:
            name: prediction-service
            port:
              number: 443
