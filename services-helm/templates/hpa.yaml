
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prediction-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prediction-app
  minReplicas: {{ .Values.predictionContainer.replicaCount }}
  maxReplicas: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0          # React immediately to load spikes
      policies:
        - type: Pods
          value: 5                            # Add up to 5 pods at once
          periodSeconds: 30                   # Every 30 seconds
        - type: Percent
          value: 50                           # Or 50% of current replicas, whichever is higher
          periodSeconds: 30
      selectPolicy: Max                       # Use the policy that adds more pods
    scaleDown:
      stabilizationWindowSeconds: 300         # Wait 5 min before scaling down to avoid flapping
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60              # Lower threshold to scale earlier
