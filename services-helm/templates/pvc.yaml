apiVersion: v1
kind: PersistentVolume
metadata:
  name: service-cache-pvc
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/service-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: service-cache-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: manual
---
