
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-app
  labels:
    app: prediction-app
spec:
  replicas: {{ .Values.predictionContainer.replicaCount  }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: prediction-app
  template:
    metadata:
      labels:
        app: prediction-app
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      containers:
        - name: prediction-container
          image: {{ .Values.predictionContainer.imageUrl }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: cache-volume
              mountPath: /root/.cache
          env:
          - name: RELEASE_VERSION
            value: {{ .Values.release_version  }}
          envFrom:
            - configMapRef:
                name: prediction-app-envs
            - configMapRef:
                name: oidc-envs
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: service-cache-pvc
