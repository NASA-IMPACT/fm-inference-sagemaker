name: Build and Push to ECR

on:
  # push:
  #   branches:
  #     - dev

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Named tag for images (e.g., v0.1.0). Defaults to git SHA."
        required: false
        type: string
      dry_run:
        description: "Build only — do not push to ECR"
        required: false
        type: boolean
        default: false
      build_static_base:
        description: "Rebuild the static base image (CUDA/PROJ/GDAL). Only needed when those versions change."
        required: false
        type: boolean
        default: false
      build_surya_base:
        description: "Rebuild the surya base image (model download + Python 3.12). Only needed when model changes."
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      image_tag:
        description: "Named tag for images (e.g., v0.1.0). Defaults to git SHA."
        required: false
        type: string
      dry_run:
        description: "Build only — do not push to ECR"
        required: false
        type: boolean
        default: false
      build_static_base:
        description: "Rebuild the static base image (CUDA/PROJ/GDAL). Only needed when those versions change."
        required: false
        type: boolean
        default: false
      build_surya_base:
        description: "Rebuild the surya base image (model download + Python 3.12). Only needed when model changes."
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      ECR_URL:
        required: true

permissions:
  contents: read

env:
  AWS_REGION: us-west-2

jobs:
  # ── Rebuild static base (CUDA + PROJ + GDAL) — only on demand ──────
  build-static-base:
    if: inputs.build_static_base == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: inputs.dry_run != true
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ secrets.ECR_URL }}"

      - name: Build static base image
        working-directory: pipelines
        run: |
          docker build \
            -t static-base:local \
            -f Dockerfile.base-static .

      - name: Push static base image
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          ECR_URL="${{ secrets.ECR_URL }}"
          REPO="inference_pipelines/static-base"
          docker tag static-base:local "${ECR_URL}/${REPO}:latest"
          docker push "${ECR_URL}/${REPO}:latest"
          echo "Pushed ${ECR_URL}/${REPO}:latest"

      - name: Save static base image artifact (dry run)
        if: inputs.dry_run == true
        run: docker save static-base:local -o /tmp/static-base-image.tar

      - name: Upload static base image artifact (dry run)
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: static-base-image
          path: /tmp/static-base-image.tar
          retention-days: 1

  # ── Build and push the base pipeline image ──────────────────────────
  build-base:
    needs: build-static-base
    if: ${{ !cancelled() && (needs.build-static-base.result == 'success' || needs.build-static-base.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      base_image_ref: ${{ steps.refs.outputs.base_image_ref }}
    steps:
      - name: Free disk space (needed for dry_run artifact export)
        if: inputs.dry_run == true
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: inputs.dry_run != true
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ secrets.ECR_URL }}"

      - name: Pull static base from ECR
        if: inputs.dry_run != true
        run: |
          docker pull "${{ secrets.ECR_URL }}/inference_pipelines/static-base:latest"

      - name: Download static base artifact (dry run, after static build)
        if: inputs.dry_run == true && inputs.build_static_base == true
        uses: actions/download-artifact@v4
        with:
          name: static-base-image
          path: /tmp

      - name: Load static base from artifact (dry run, after static build)
        if: inputs.dry_run == true && inputs.build_static_base == true
        run: docker load -i /tmp/static-base-image.tar

      - name: Build base image
        working-directory: pipelines
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            STATIC_REF="static-base:local"
          else
            STATIC_REF="${{ secrets.ECR_URL }}/inference_pipelines/static-base:latest"
          fi

          docker build \
            --build-arg STATIC_BASE_IMAGE="${STATIC_REF}" \
            -t base:local \
            -f Dockerfile.base .

      - name: Compute tags and push
        id: refs
        run: |
          set -euo pipefail
          DIGEST=$(docker inspect --format='{{.Id}}' base:local | cut -d: -f2 | cut -c1-12)

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: skipping push"
            echo "base_image_ref=base:local" >> "$GITHUB_OUTPUT"
          else
            ECR_URL="${{ secrets.ECR_URL }}"

            if [ -n "${{ inputs.image_tag }}" ]; then
              NAMED_TAG="${{ inputs.image_tag }}"
            else
              NAMED_TAG="${GITHUB_SHA:0:12}"
            fi

            REPO="inference_pipelines/base"
            docker tag base:local "${ECR_URL}/${REPO}:${DIGEST}"
            docker tag base:local "${ECR_URL}/${REPO}:${NAMED_TAG}"
            docker tag base:local "${ECR_URL}/${REPO}:latest"

            docker push "${ECR_URL}/${REPO}:${DIGEST}"
            docker push "${ECR_URL}/${REPO}:${NAMED_TAG}"
            docker push "${ECR_URL}/${REPO}:latest"

            echo "base_image_ref=${REPO}:${DIGEST}" >> "$GITHUB_OUTPUT"
          fi

      - name: Free space before save (dry run)
        if: inputs.dry_run == true
        run: |
          docker rmi static-base:local 2>/dev/null || true
          rm -f /tmp/static-base-image.tar 2>/dev/null || true
          docker image prune -f

      - name: Save base image for service builds (dry run)
        if: inputs.dry_run == true
        run: docker save base:local -o /tmp/base-image.tar

      - name: Upload base image artifact (dry run)
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: base-image
          path: /tmp/base-image.tar
          retention-days: 1

  # ── Build and push the main inference image ─────────────────────────
  build-inference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: inputs.dry_run != true
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ secrets.ECR_URL }}"

      - name: Pull cache image
        if: inputs.dry_run != true
        run: |
          docker pull "${{ secrets.ECR_URL }}/inference:latest" 2>/dev/null || true

      - name: Build inference image
        run: |
          CACHE_ARGS=""
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            CACHE_ARGS="--cache-from ${{ secrets.ECR_URL }}/inference:latest"
          fi
          docker build \
            $CACHE_ARGS \
            -t inference:local \
            -f Dockerfile .

      - name: Compute tags and push
        run: |
          set -euo pipefail
          DIGEST=$(docker inspect --format='{{.Id}}' inference:local | cut -d: -f2 | cut -c1-12)

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: skipping push"
          else
            ECR_URL="${{ secrets.ECR_URL }}"

            if [ -n "${{ inputs.image_tag }}" ]; then
              NAMED_TAG="${{ inputs.image_tag }}"
            else
              NAMED_TAG="${GITHUB_SHA:0:12}"
            fi

            docker tag inference:local "${ECR_URL}/inference:${DIGEST}"
            docker tag inference:local "${ECR_URL}/inference:${NAMED_TAG}"
            docker tag inference:local "${ECR_URL}/inference:latest"

            docker push "${ECR_URL}/inference:${DIGEST}"
            docker push "${ECR_URL}/inference:${NAMED_TAG}"
            docker push "${ECR_URL}/inference:latest"
          fi

  # ── Build and push service images (depend on base) ─────────────────
  build-services:
    needs: build-base
    if: ${{ !cancelled() && needs.build-base.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: floods
            dockerfile: pipelines/floods/Dockerfile
            ecr_repo: inference_pipelines/floods
            context: pipelines

          - service: burn_scars
            dockerfile: pipelines/burn_scars/Dockerfile
            ecr_repo: inference_pipelines/burn_scars
            context: pipelines

          - service: crop_classification
            dockerfile: pipelines/crop_classification/Dockerfile
            ecr_repo: inference_pipelines/crop_classification
            context: pipelines

          - service: tiler
            dockerfile: tile_server/Dockerfile
            ecr_repo: tile_server/tiler
            context: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: inputs.dry_run != true
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ secrets.ECR_URL }}"

      - name: Pull base image from ECR
        if: inputs.dry_run != true
        run: |
          docker pull "${{ secrets.ECR_URL }}/${{ needs.build-base.outputs.base_image_ref }}"

      - name: Download base image artifact (dry run)
        if: inputs.dry_run == true
        uses: actions/download-artifact@v4
        with:
          name: base-image
          path: /tmp

      - name: Load base image (dry run)
        if: inputs.dry_run == true
        run: docker load -i /tmp/base-image.tar

      - name: Build ${{ matrix.service }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            BASE_REF="base:local"
          else
            BASE_REF="${{ secrets.ECR_URL }}/${{ needs.build-base.outputs.base_image_ref }}"
          fi

          docker build \
            --build-arg BASE_IMAGE="${BASE_REF}" \
            -t "${{ matrix.service }}:local" \
            -f "${{ matrix.dockerfile }}" \
            "${{ matrix.context }}"

      - name: Compute tags and push
        run: |
          set -euo pipefail
          DIGEST=$(docker inspect --format='{{.Id}}' "${{ matrix.service }}:local" | cut -d: -f2 | cut -c1-12)

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: skipping push for ${{ matrix.service }}"
          else
            ECR_URL="${{ secrets.ECR_URL }}"

            if [ -n "${{ inputs.image_tag }}" ]; then
              NAMED_TAG="${{ inputs.image_tag }}"
            else
              NAMED_TAG="${GITHUB_SHA:0:12}"
            fi

            REPO="${{ matrix.ecr_repo }}"
            docker tag "${{ matrix.service }}:local" "${ECR_URL}/${REPO}:${DIGEST}"
            docker tag "${{ matrix.service }}:local" "${ECR_URL}/${REPO}:${NAMED_TAG}"
            docker tag "${{ matrix.service }}:local" "${ECR_URL}/${REPO}:latest"

            docker push "${ECR_URL}/${REPO}:${DIGEST}"
            docker push "${ECR_URL}/${REPO}:${NAMED_TAG}"
            docker push "${ECR_URL}/${REPO}:latest"
          fi

  # ── Rebuild surya base (model download + Python 3.12) — only on demand
  build-surya-base:
    if: ${{ inputs.build_surya_base == true && !cancelled() && needs.build-base.result == 'success' }}
    needs: build-base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: inputs.dry_run != true
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ secrets.ECR_URL }}"

      - name: Pull base image from ECR
        if: inputs.dry_run != true
        run: |
          docker pull "${{ secrets.ECR_URL }}/${{ needs.build-base.outputs.base_image_ref }}"

      - name: Download base image artifact (dry run)
        if: inputs.dry_run == true
        uses: actions/download-artifact@v4
        with:
          name: base-image
          path: /tmp

      - name: Load base image (dry run)
        if: inputs.dry_run == true
        run: docker load -i /tmp/base-image.tar

      - name: Build surya base image
        working-directory: pipelines
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            BASE_REF="base:local"
          else
            BASE_REF="${{ secrets.ECR_URL }}/${{ needs.build-base.outputs.base_image_ref }}"
          fi

          docker build \
            --build-arg BASE_IMAGE="${BASE_REF}" \
            -t surya-base:local \
            -f surya/Dockerfile.base .

      - name: Push surya base image
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          ECR_URL="${{ secrets.ECR_URL }}"
          REPO="inference_pipelines/surya-base"
          docker tag surya-base:local "${ECR_URL}/${REPO}:latest"
          docker push "${ECR_URL}/${REPO}:latest"
          echo "Pushed ${ECR_URL}/${REPO}:latest"

  # ── Build and push surya service image ──────────────────────────────
  build-surya:
    needs: [build-base, build-surya-base]
    if: ${{ !cancelled() && needs.build-base.result == 'success' && (needs.build-surya-base.result == 'success' || needs.build-surya-base.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: inputs.dry_run != true
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ secrets.ECR_URL }}"

      - name: Pull surya base from ECR
        if: inputs.dry_run != true
        run: |
          docker pull "${{ secrets.ECR_URL }}/inference_pipelines/surya-base:latest"

      - name: Pull cache image
        if: inputs.dry_run != true
        run: |
          docker pull "${{ secrets.ECR_URL }}/inference_pipelines/surya_rollout:latest" 2>/dev/null || true

      - name: Build surya service
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: surya requires surya-base from ECR, skipping"
            exit 0
          fi

          docker build \
            --cache-from "${{ secrets.ECR_URL }}/inference_pipelines/surya_rollout:latest" \
            --build-arg BASE_IMAGE="${{ secrets.ECR_URL }}/inference_pipelines/surya-base:latest" \
            -t surya_rollout:local \
            -f pipelines/surya/Dockerfile \
            pipelines

      - name: Compute tags and push
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          ECR_URL="${{ secrets.ECR_URL }}"
          DIGEST=$(docker inspect --format='{{.Id}}' surya_rollout:local | cut -d: -f2 | cut -c1-12)

          if [ -n "${{ inputs.image_tag }}" ]; then
            NAMED_TAG="${{ inputs.image_tag }}"
          else
            NAMED_TAG="${GITHUB_SHA:0:12}"
          fi

          REPO="inference_pipelines/surya_rollout"
          docker tag surya_rollout:local "${ECR_URL}/${REPO}:${DIGEST}"
          docker tag surya_rollout:local "${ECR_URL}/${REPO}:${NAMED_TAG}"
          docker tag surya_rollout:local "${ECR_URL}/${REPO}:latest"

          docker push "${ECR_URL}/${REPO}:${DIGEST}"
          docker push "${ECR_URL}/${REPO}:${NAMED_TAG}"
          docker push "${ECR_URL}/${REPO}:latest"
