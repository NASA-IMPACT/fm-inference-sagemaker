apiVersion: v1
kind: PersistentVolume
metadata:
  name: prediction-cache-pvc
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /tmp/prediction-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prediction-cache-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: manual
---