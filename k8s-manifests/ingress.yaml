apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prediction-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300s"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300s"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300s"
    # Add these missing annotations:
    nginx.ingress.kubernetes.io/upstream-timeout: "300s"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "300s"
    nginx.ingress.kubernetes.io/client-body-timeout: "300s"
    nginx.ingress.kubernetes.io/client-header-timeout: "300s"
spec:
  tls:
  - hosts:
    - kind.neo.nsstc.uah.edu
    secretName: ingress-tls
  rules:
  - host: kind.neo.nsstc.uah.edu
    http:
      paths:
      - path: /api/predict
        pathType: Prefix
        backend:
          service:
            name: prediction-service
            port:
              number: 443
