services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fm-finetuning-app
    environment:
      - EARTHDATA_USERNAME=''
      - EARTHDATA_PASSWORD=''
      - POSTGRES_PASSWORD=''
    ports:
      - "8000:8000"
    volumes:
      - ./code:/app/code
    networks:
      - fm-network
    command: >
      sh -c "
        # echo 'Waiting for database to be ready...' &&
        # sleep 10 &&
        alembic upgrade head &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres_data:

networks:
  fm-network:
    driver: bridge
